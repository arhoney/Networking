networks:
  # All monitoring containers communicate on this isolated bridge network.
  # Nothing on this network is reachable from the LAN unless explicitly port-mapped below.
  monitoring-plane:
    driver: bridge

services:

  # ─────────────────────────────────────────────────────────────────────────
  # Omada Exporter (charlie-haley/omada_exporter)
  # Authenticates to the Omada Controller's local /api/v2 endpoint using a
  # read-only viewer account. Exposes per-client RSSI and AP stats as
  # Prometheus metrics at :9202/metrics, scraped every 10 seconds.
  #
  # Credentials: set OMADA_HOST, OMADA_USER, OMADA_PASS, and OMADA_SITE
  # in a .env file in this directory (never commit that file to git).
  # ─────────────────────────────────────────────────────────────────────────
  omada-exporter:
    image: chhaley/omada-exporter:latest
    container_name: omada-exporter
    restart: unless-stopped
    networks:
      - monitoring-plane
    ports:
      # Prometheus scrapes this port. Localhost-only — not reachable from LAN.
      - "127.0.0.1:9202:9202"
    environment:
      - OMADA_HOST=${OMADA_HOST}
      - OMADA_USER=${OMADA_USER}
      - OMADA_PASS=${OMADA_PASS}
      - OMADA_SITE=${OMADA_SITE:-Default}
      # Allow the controller's self-signed TLS certificate (standard for local Omada installs)
      - OMADA_INSECURE=true

  # ─────────────────────────────────────────────────────────────────────────
  # Prometheus
  # Scrapes the exporter at 10-second resolution — tight enough to capture
  # a client mid-flap between access points before the next handshake completes.
  # Data is retained for 90 days.
  # ─────────────────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    networks:
      - monitoring-plane
    ports:
      - "127.0.0.1:9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=90d"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  # ─────────────────────────────────────────────────────────────────────────
  # Grafana Loki (pinned to 2.9.4 for stability)
  # Receives forwarded syslog from Promtail and stores log streams permanently,
  # bypassing the Omada Controller's internal 7,650-entry log ceiling.
  #
  # Uses Loki's built-in local-config.yaml — data persists in the named volume.
  # ─────────────────────────────────────────────────────────────────────────
  loki:
    image: grafana/loki:2.9.4
    container_name: loki
    restart: unless-stopped
    networks:
      - monitoring-plane
    ports:
      - "127.0.0.1:3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki-data:/loki

  # ─────────────────────────────────────────────────────────────────────────
  # Promtail (pinned to 2.9.4 to match Loki)
  # Listens on UDP 1514 inside the container. The host-side port mapping
  # exposes this as port 514 on the server — the standard syslog port that
  # the Omada Controller sends to by default.
  #
  # HOST PORT NOTE: Port 514 is a privileged port on Linux (< 1024).
  # Docker itself runs as root, so this mapping works with a standard Docker
  # install. If you see "permission denied" on startup, see GUIDE.md.
  # ─────────────────────────────────────────────────────────────────────────
  promtail:
    image: grafana/promtail:2.9.4
    container_name: promtail
    restart: unless-stopped
    networks:
      - monitoring-plane
    ports:
      # Host 514 (standard syslog — what Omada sends to) → container 1514 (Promtail listener)
      - "0.0.0.0:514:1514/udp"
    volumes:
      - ./loki/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
    command: -config.file=/etc/promtail/promtail-config.yml
    depends_on:
      - loki

  # ─────────────────────────────────────────────────────────────────────────
  # Grafana
  # Bound to 127.0.0.1 only — not directly reachable from any LAN device.
  # Access via SSH tunnel:  ssh -L 3000:127.0.0.1:3000 user@<server-ip>
  # Then open:              http://localhost:3000
  # Or access via Tailscale/WireGuard on the server's private VPN IP.
  # ─────────────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    networks:
      - monitoring-plane
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:-admin}
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki

# ─────────────────────────────────────────────────────────────────────────────
# Named volumes persist data between restarts and image upgrades.
# To wipe all stored data:  docker compose down -v
# ─────────────────────────────────────────────────────────────────────────────
volumes:
  prometheus-data:
  loki-data:
  grafana-data:
